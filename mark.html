{% extends 'base.html' %}
{% block content %}
<div class="ui-card">
    <h2>Mark Attendance</h2>
    <p style="color: #64748b; margin-bottom: 20px;">Enter your class credentials below</p>
    
    <form id="attendanceForm" onsubmit="handleFormSubmit(event)">
        <div class="input-block">
            <label>Student ID</label>
            <input type="text" id="sid" placeholder="e.g., S001" required>
        </div>
        
        <div class="input-block">
            <label>Student Name</label>
            <input type="text" id="sname" placeholder="e.g., Alice Johnson" required>
        </div>
        
        <button type="submit" class="primary-btn">Submit Log</button>
    </form>
</div>

<script>
function handleFormSubmit(event) {
    event.preventDefault(); // Stop standard blank page reloads
    const studentId = document.getElementById('sid').value.trim();
    const studentName = document.getElementById('sname').value.trim();
    
    if (studentId && studentName) {
        // Route the browser directly to the web address app.py expects
        window.location.href = `/mark/${studentId}/${studentName}`;
    }
}
</script>
{% endblock %}
